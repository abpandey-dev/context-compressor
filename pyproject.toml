[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxcompress"
version = "0.1.0"
description = "Shrink tool outputs, logs and documents before they reach an LLM, and measure what it costs in accuracy."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
bench = ["anthropic>=1.0", "pandas>=2.0", "matplotlib>=3.7", "pdfplumber>=0.11"]
dev = ["pytest>=8", "anthropic>=1.0", "pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
ctxc = "ctxcompress.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
