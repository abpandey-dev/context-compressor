<text x="600" y="397" font-size="13" fill="#334155" text-anchor="end">45/53 correct</text>
<rect x="648" y="104" width="528" height="330" rx="14" fill="#F8FAFC" stroke="#E2E8F0"/>
<text x="668" y="136" font-size="16" fill="#0F172A" font-weight="700">Where the answers go</text>
<text x="668" y="158" font-size="12" fill="#64748B">share answered correctly</text>
<text x="940" y="172" font-size="12" fill="#475569" font-weight="700" text-anchor="end">Smart</text>
<text x="1030" y="172" font-size="12" fill="#475569" font-weight="700" text-anchor="end">Select</text>
<text x="1140" y="172" font-size="12" fill="#475569" font-weight="700" text-anchor="end">LLM sum.</text>
