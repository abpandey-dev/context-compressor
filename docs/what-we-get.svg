<text x="940" y="210" font-size="14" fill="#15803D" font-weight="700" text-anchor="end">100%</text>
<text x="1030" y="210" font-size="14" fill="#B45309" font-weight="700" text-anchor="end">93%</text>
<text x="1140" y="210" font-size="14" fill="#B45309" font-weight="700" text-anchor="end">90%</text>
<text x="668" y="250" font-size="14" fill="#0F172A" font-weight="600">Count / total / max</text>
<text x="940" y="250" font-size="14" fill="#B45309" font-weight="700" text-anchor="end">94%</text>
<text x="1030" y="250" font-size="14" fill="#B91C1C" font-weight="700" text-anchor="end">61%</text>
<text x="1140" y="250" font-size="14" fill="#B91C1C" font-weight="700" text-anchor="end">72%</text>
<text x="668" y="290" font-size="14" fill="#0F172A" font-weight="600">Not in the context</text>
<text x="940" y="290" font-size="14" fill="#15803D" font-weight="700" text-anchor="end">100%</text>
<text x="1030" y="290" font-size="14" fill="#15803D" font-weight="700" text-anchor="end">100%</text>
<text x="1140" y="290" font-size="14" fill="#15803D" font-weight="700" text-anchor="end">100%</text>
<text x="668" y="352" font-size="13" fill="#334155">Partial context (select, summaries) loses counts</text>
<text x="668" y="374" font-size="13" fill="#334155">and totals; smart keeps them, because the counts</text>
<text x="668" y="396" font-size="13" fill="#334155">are computed before the model sees the log.</text>
<rect x="24" y="458" width="276" height="182" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
<text x="44" y="504" font-size="34" fill="#1D4ED8" font-weight="800">-82%</text>
<text x="44" y="534" font-size="14" fill="#0F172A" font-weight="700">tokens with smart compression</text>
<text x="44" y="558" font-size="12" fill="#475569">52/53 correct, same as raw</text>
<text x="44" y="576" font-size="12" fill="#475569">$0.0042 -&gt; $0.0008</text>
<text x="44" y="594" font-size="12" fill="#475569">per question</text>
<rect x="316" y="458" width="276" height="182" rx="14" fill="#F5F3FF" stroke="#DDD6FE"/>
<text x="336" y="504" font-size="34" fill="#6D28D9" font-weight="800">-98%</text>
<text x="336" y="534" font-size="14" fill="#0F172A" font-weight="700">on a 1,703-line incident log</text>
<text x="336" y="558" font-size="12" fill="#475569">91K -&gt; 2.2K tokens; raw made the</text>
<text x="336" y="576" font-size="12" fill="#475569">model miscount (36 vs 37);</text>
<text x="336" y="594" font-size="12" fill="#475569">the pattern count was exact</text>
<rect x="608" y="458" width="276" height="182" rx="14" fill="#F0FDF4" stroke="#BBF7D0"/>
<text x="628" y="504" font-size="30" fill="#15803D" font-weight="800">Lossless</text>
<text x="628" y="534" font-size="14" fill="#0F172A" font-weight="700">JSON tables decode exactly</text>
<text x="628" y="558" font-size="12" fill="#475569">back to the original: 5 real</text>
<text x="628" y="576" font-size="12" fill="#475569">API responses + 3,000</text>
<text x="628" y="594" font-size="12" fill="#475569">random values, tested in CI</text>
<rect x="900" y="458" width="276" height="182" rx="14" fill="#FFFBEB" stroke="#FDE68A"/>
<text x="920" y="504" font-size="30" fill="#B45309" font-weight="800">&#x27;About 48&#x27;</text>
<text x="920" y="534" font-size="14" fill="#0F172A" font-weight="700">an LLM summary&#x27;s count</text>
<text x="920" y="558" font-size="12" fill="#475569">the log had 47 503s; the</text>
<text x="920" y="576" font-size="12" fill="#475569">summary rounded it, and</text>
<text x="920" y="594" font-size="12" fill="#475569">max latency 884 became 900</text>
</svg>
