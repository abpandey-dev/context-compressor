<text x="152" y="271" font-size="13" fill="#0F172A" font-weight="700" text-anchor="end">Smart</text>
<rect x="164" y="252" width="250" height="28" rx="4" fill="#F1F5F9"/>
<rect x="164" y="252" width="46.1" height="28" rx="4" fill="#2563EB"/>
<text x="218.0675590281209" y="271" font-size="13" fill="#334155" font-weight="700">7.6K</text>
<text x="600" y="271" font-size="13" fill="#0F172A" font-weight="700" text-anchor="end">52/53 correct</text>
<text x="152" y="313" font-size="13" fill="#334155" text-anchor="end">Select</text>
<rect x="164" y="294" width="250" height="28" rx="4" fill="#F1F5F9"/>
<rect x="164" y="294" width="46.6" height="28" rx="4" fill="#D97706"/>
